services:
  - type: web
    name: nayara-agenda
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nayara-db
          property: connectionString

databases:
  - name: nayara-db
    databaseName: nayara_agenda
    user: nayara
    plan: free
